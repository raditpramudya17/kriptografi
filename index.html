<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>listing directory /</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #24292f;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 100px;
            margin: 0;
        }
        .container {
            width: 80%;
            max-width: 600px;
        }
        h1 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 30px;
            color: #333;
        }
        .file-card {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            text-decoration: none;
            color: #0366d6;
            transition: background 0.2s;
            width: fit-content;
        }
        .file-card:hover {
            background-color: #f6f8fa;
        }
        .file-icon {
            margin-right: 10px;
            color: #0366d6;
        }
        .footer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>~ /</h1>
        
        <a href="kripto.py" class="file-card">
            <span class="file-icon">📄</span> kripto.py
        </a>
    </div>

    <div class="footer">
        Explorer Developed by @raditpramudya17
    </div>

</body>
</html>
